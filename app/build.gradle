plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.dam2.treeplayer'
    compileSdk 36

    defaultConfig {
        applicationId "com.dam2.treeplayer"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // Para los íconos de la propia Google Fonts
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    //GSON
    implementation 'com.google.code.gson:gson:2.10.1'

    //librería para peticiones HTTP y parsear parsear HTML
    implementation 'com.squareup.okhttp3:okhttp:4.12.0' //Peticiones
    implementation 'org.jsoup:jsoup:1.18.1' //Parsear

    //Api
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
